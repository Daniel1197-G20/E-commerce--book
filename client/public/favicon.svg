<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A4E27" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EBE4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9A4E27" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#book-grad)" filter="url(#glow)" />
  
  <!-- Left Page -->
  <path d="M16 20 C24 18, 30 22, 32 24 V44 C30 42, 24 38, 16 40 Z" fill="url(#page-grad)" />
  
  <!-- Right Page -->
  <path d="M48 20 C40 18, 34 22, 32 24 V44 C34 42, 40 38, 48 40 Z" fill="url(#page-grad)" opacity="0.92" />
  
  <!-- Spine Line -->
  <path d="M32 24 V44" stroke="#9A4E27" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Page Lines -->
  <line x1="20" y1="26" x2="27" y2="24.5" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="20" y1="31" x2="27" y2="29.5" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="20" y1="36" x2="25" y2="35" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <line x1="37" y1="24.5" x2="44" y2="26" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="37" y1="29.5" x2="44" y2="31" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="39" y1="35" x2="44" y2="36" stroke="#9A4E27" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
</svg>